services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: match_engine_api
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./api:/workspace/api
      - ./engine:/workspace/engine
      - workspace_node_modules:/workspace/node_modules
    command: npm run dev

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: match_engine_web
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_URL: "http://localhost:3000"
    volumes:
      - ./web:/workspace/web
      - ./api:/workspace/api
      - ./engine:/workspace/engine
      - workspace_node_modules:/workspace/node_modules
    command: npm run dev --workspace web -- --host 0.0.0.0
    depends_on:
      - api

  engine:
    build:
      context: .
      dockerfile: engine/Dockerfile
    profiles: ["tools"]
    working_dir: /workspace/engine
    volumes:
      - ./engine:/workspace/engine
      - workspace_node_modules:/workspace/node_modules
    command: npm test -- --runInBand

volumes:
  workspace_node_modules:
